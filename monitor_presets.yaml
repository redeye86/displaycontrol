presets:
  - name: tv
    audio:
      card: NVidia          # ALSA-ID aus /proc/asound/cards
      sink_match: hdmi      # Regex auf den Sink-Namen
      port: hdmi-output-0
      wait: 20              # max. Sekunden warten, bis der TV-Ton verfügbar ist
    outputs:
      - id: "8d6cf6987f66"
        active: true
        resolution: 3840x2160@60
        position: 0,0
        priority: 1
      - id: "cf6101061f3d"
        active: false
        resolution: 2560x1440@165
        position: 1920,0
        priority: 1
      - id: "8d32bfa732af"
        active: false
        resolution: 1920x1080@60
        position: 0,180
        priority: 2
      - id: "25f4781c89d0"
        active: false
        resolution: 1920x1080@60
        position: 4480,180
        priority: 3

  - name: monitors
    audio:
      card: Creative
      sink_match: analog
      port: analog-output;output-headphones-1
      #port: analog-output-lineout;output-speaker   # bei Profil analog-surround-21
    outputs:
      - id: "cf6101061f3d"
        active: true
        resolution: 2560x1440@165
        position: 1920,0
        priority: 1
        # optional: feste ddcutil-Displaynummer als Fallback/Override
        # ddc_display: 2
      - id: "8d32bfa732af"
        active: true
        resolution: 1920x1080@60
        position: 0,180
        priority: 2
      - id: "25f4781c89d0"
        active: true
        resolution: 1920x1080@60
        position: 4480,180
        priority: 3
      - id: "8d6cf6987f66"
        active: false
        resolution: 3840x2160@60
        position: 0,0
